# Single runtime source of repository identity and component versions.
REPO_OWNER=McElast
REPO_NAME=3x-easy-one
KIT_CONFIG_DIR=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
if [[ -r $KIT_CONFIG_DIR/../KIT_VERSION ]]; then
  KIT_VERSION=$(cat "$KIT_CONFIG_DIR/../KIT_VERSION")
else
  KIT_VERSION=$(cat "$KIT_CONFIG_DIR/KIT_VERSION")
fi
REPO_REF=${KIT_REF:-$KIT_VERSION}
RAW_BASE="https://raw.githubusercontent.com/$REPO_OWNER/$REPO_NAME/$REPO_REF"
REPO_URL="https://github.com/$REPO_OWNER/$REPO_NAME"
